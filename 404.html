<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İlker Coşkunsel</title>
  <link rel="canonical" href="https://ilkercoskunsel.com/" />
  <script>
    // GitHub Pages SPA routing fallback.
    // Captures the path from the URL and stores it, then redirects to root.
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // Encode the path as a query param and redirect to root
      if (path !== '/') {
        sessionStorage.setItem('redirect-path', path + search + hash);
        window.location.replace('/?p=' + encodeURIComponent(path + search + hash));
      }
    })();
  </script>
</head>
<body>
  <p style="font-family:monospace;padding:40px;color:#c4a7e7;">REDIRECTING...</p>
</body>
</html>
